[project]
name = "naughty-commits"
version = "0.2.0"
description = "See how many of your commits land outside work hours."
authors = [{ name = "Kieran Gee" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["pygit2>=1.15.1"]

[project.optional-dependencies]
type = ["ty>=0.0.69"]

lint = ["ruff>=0.16.2"]

test = ["pytest>=8.3.0", "coverage>=7.6.0", "pytest-random-order"]

[project.urls]
Repository = "https://github.com/kism/naughtycommits"

[project.scripts]
naughty-commits = "naughty_commits.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    # Modules
    "DJ",   # Django not required
    "AIR",  # Airflow not required
    "FAST", # FastAPI not required
    "DTZ",  # Timezones are handled explicitly where they matter

    # Specific rules
    "missing-todo-author",                       # Verbose TODO, only I work on this project
    "missing-todo-link",                         # Verbose TODO, only I work on this project
    "single-line-implicit-string-concatenation", # Conflict in the formatter
    "missing-trailing-comma",                    # Conflict in the formatter
    "D",                                         # Don't care about docstrings
    "DOC",                                       # Don't care about docstrings
    "missing-copyright-notice",                  # Copyright lives in pyproject.toml
    "print",                                     # Printing the report is the point
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant
    "FBT", # Booleans as positional arguments are fine via @pytest.mark.parametrize()
    "ANN", # Don't care about annotations in tests
    "D",   # Don't care about docstrings in tests
    "DOC", # Don't care about docstrings in tests

    "assert",                     # Asserts allowed in tests
    "private-member-access",      # Accessing private members is needed for testing
    "implicit-namespace-package", # __init__.py not needed for PyTest
    "too-many-arguments",         # Tests can have as many arguments as they want
    "import-private-name",        # Tests can import private members
    "magic-value-comparison",     # Asserting against literal values is the point of a test
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 40

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
command_line = ".venv/bin/pytest -q"
source = ["naughty_commits"]
context = "test"

[tool.coverage.report]
show_missing = false
format = "text"
sort = "-Miss"

[tool.coverage.html]
show_contexts = true
